version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "master"
    # Let a release age before adopting it; a compromised publish is usually
    # caught and yanked within days. Does not apply to security updates.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      patch-updates:
        update-types:
          - "patch"
      minor-updates:
        update-types:
          - "minor"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maintenance"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "master"
    labels:
      - "dependencies"
      - "maintenance"
      - "github-actions"
