# Build/test on master and release; deploy to GitHub Pages from release only
name: Deploy React App to Pages

on:
  # Build + test on master; build + test + deploy on release
  push:
    branches: ['master', 'release']

  # Build + test every PR (incl. Dependabot) before it can be merged
  pull_request:
    branches: ['master', 'release']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Least privilege by default; the deploy job re-grants only what it needs
permissions:
  contents: read

# Allow one concurrent run per branch so a master build can't cancel a release deploy
concurrency:
  group: 'pages-${{ github.ref }}'
  # Never cancel an in-flight release deploy; superseding master builds are fine to drop
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config where build tooling could read it
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: index.html not found in dist directory"
            exit 1
          fi
          echo "Build validation successful"

      - name: Upload artifact
        if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload dist repository
          path: './dist'

  deploy:
    # Deploy only from release pushes or a manual dispatch
    if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
